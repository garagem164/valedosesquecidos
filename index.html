<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Jogo - Personagem Customizado</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: #1e1e24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 20px;
    }

    p {
      margin-bottom: 10px;
      color: #aaa;
      font-size: 14px;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 320px;
      background-color: #2b2b36;
      border: 4px solid #4e4e63;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    /* Container com o tamanho padrão de 1 frame do LPC (64x64px) */
    #player {
      position: absolute;
      width: 64px;
      height: 64px;
      background-image: url('./assets/character-spritesheet.png');
      background-repeat: no-repeat;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 65px);
      grid-template-rows: repeat(3, 65px);
      gap: 8px;
      margin-top: 15px;
      justify-content: center;
    }

    .btn-touch {
      background-color: #3b3b4f;
      color: #fff;
      border: 2px solid #5d5d7a;
      border-radius: 12px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 0 #222230;
    }

    .btn-touch:active {
      background-color: #5d5d7a;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #222230;
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>Mini Jogo RPG</h1>
  <p>Toque nos botões para mover o personagem</p>

  <div id="game-container">
    <div id="player"></div>
  </div>

  <div class="touch-controls">
    <button class="btn-touch btn-up" id="btn-up">⬆</button>
    <button class="btn-touch btn-left" id="btn-left">⬅</button>
    <button class="btn-touch btn-down" id="btn-down">⬇</button>
    <button class="btn-touch btn-right" id="btn-right">➡</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const container = document.getElementById('game-container');

    const frameSize = 64; // Tamanho padrão de cada quadro (64x64px)
    const speed = 3;

    let posX = (container.clientWidth - frameSize) / 2;
    let posY = (container.clientHeight - frameSize) / 2;

    // Configuração das linhas no Spritesheet do LPC
    let currentFrame = 0;       // Quadro atual (0 a 8)
    let animationRow = 10;      // Começa virado para frente (Linha 10)
    let frameTimer = 0;
    const totalWalkFrames = 9;  // 9 passos na animação
    const animationSpeed = 5;   // Velocidade da troca de quadros

    const keys = { Up: false, Down: false, Left: false, Right: false };

    // --- Suporte para Celular (Touch) ---
    function bindButton(id, keyName) {
      const btn = document.getElementById(id);
      
      const press = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[keyName] = true;
      };

      const release = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[keyName] = false;
      };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
    }

    bindButton('btn-up', 'Up');
    bindButton('btn-down', 'Down');
    bindButton('btn-left', 'Left');
    bindButton('btn-right', 'Right');

    // --- Suporte para Teclado (PC) ---
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.Up = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.Down = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.Left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.Right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.Up = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.Down = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.Left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.Right = false;
    });

    // --- Loop do Jogo ---
    function gameLoop() {
      let isMoving = false;

      // Define a linha da imagem de acordo com a direção acionada
      if (keys.Up) {
        posY -= speed;
        animationRow = 8;  // Linha 8: Costas (Cima)
        isMoving = true;
      } else if (keys.Down) {
        posY += speed;
        animationRow = 10; // Linha 10: Frente (Baixo)
        isMoving = true;
      } else if (keys.Left) {
        posX -= speed;
        animationRow = 9;  // Linha 9: Esquerda
        isMoving = true;
      } else if (keys.Right) {
        posX += speed;
        animationRow = 11; // Linha 11: Direita
        isMoving = true;
      }

      // Limites da tela
      posX = Math.max(0, Math.min(container.clientWidth - frameSize, posX));
      posY = Math.max(0, Math.min(container.clientHeight - frameSize, posY));

      // Lógica de alternância das pernas e braços
      if (isMoving) {
        frameTimer++;
        if (frameTimer >= animationSpeed) {
          frameTimer = 0;
          // Alterna do quadro 1 ao 8 (o quadro 0 é parado)
          currentFrame = (currentFrame % (totalWalkFrames - 1)) + 1;
        }
      } else {
        currentFrame = 0; // Posição neutra (em pé) ao parar
        frameTimer = 0;
      }

      // Atualiza a posição na tela e desloca a imagem de fundo
      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      const bgX = -(currentFrame * frameSize);
      const bgY = -(animationRow * frameSize);
      player.style.backgroundPosition = `${bgX}px ${bgY}px`;

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
