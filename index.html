<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Jogo - Movimentação</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e1e24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    p {
      margin-bottom: 15px;
      color: #aaa;
    }

    #game-container {
      position: relative;
      width: 600px;
      height: 400px;
      background-color: #2b2b36;
      border: 4px solid #4e4e63;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    #player {
      position: absolute;
      width: 64px;
      height: 80px;
      /* Usa a tag <img> diretamente ou ajusta o background */
      background-image: url('./assets/Spr_E_Noland.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .controls-hint {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .key {
      background-color: #333;
      border: 1px solid #555;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Mini Jogo de Movimentação</h1>
  <p>Use as setas do teclado ou as teclas WASD para andar</p>

  <div id="game-container">
    <div id="player"></div>
  </div>

  <div class="controls-hint">
    <span class="key">W / ⬆</span>
    <span class="key">A / ⬅</span>
    <span class="key">S / ⬇</span>
    <span class="key">D / ➡</span>
  </div>

  <script>
    const player = document.getElementById('player');
    const container = document.getElementById('game-container');

    const playerWidth = 64;
    const playerHeight = 80;
    const speed = 5;

    let posX = (container.clientWidth - playerWidth) / 2;
    let posY = (container.clientHeight - playerHeight) / 2;

    const keys = {
      ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
      w: false, s: false, a: false, d: false,
      W: false, S: false, A: false, D: false
    };

    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    function gameLoop() {
      if (keys.ArrowUp || keys.w || keys.W) posY -= speed;
      if (keys.ArrowDown || keys.s || keys.S) posY += speed;

      if (keys.ArrowLeft || keys.a || keys.A) {
        posX -= speed;
        player.style.transform = 'scaleX(-1)';
      }
      if (keys.ArrowRight || keys.d || keys.D) {
        posX += speed;
        player.style.transform = 'scaleX(1)';
      }

      posX = Math.max(0, Math.min(container.clientWidth - playerWidth, posX));
      posY = Math.max(0, Math.min(container.clientHeight - playerHeight, posY));

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
