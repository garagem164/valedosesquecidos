<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Jogo - Movimentação</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: #1e1e24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 20px;
    }

    p {
      margin-bottom: 10px;
      color: #aaa;
      font-size: 14px;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 320px;
      background-color: #2b2b36;
      border: 4px solid #4e4e63;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    #player {
      position: absolute;
      width: 64px;
      height: 80px;
      background-image: url('./assets/Spr_E_Noland.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Removida qualquer transicao para o movimento ser instantaneo */
      transition: none;
    }

    /* Controle Virtual Touch para Celular */
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 5px;
      margin-top: 15px;
      justify-content: center;
    }

    .btn-touch {
      background-color: #3b3b4f;
      color: #fff;
      border: 2px solid #5d5d7a;
      border-radius: 12px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 0 #222230;
    }

    .btn-touch:active {
      background-color: #5d5d7a;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #222230;
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>Mini Jogo Mobile</h1>
  <p>Toque nos botões para mover o personagem</p>

  <div id="game-container">
    <div id="player"></div>
  </div>

  <div class="touch-controls">
    <button class="btn-touch btn-up" id="btn-up">⬆</button>
    <button class="btn-touch btn-left" id="btn-left">⬅</button>
    <button class="btn-touch btn-down" id="btn-down">⬇</button>
    <button class="btn-touch btn-right" id="btn-right">➡</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const container = document.getElementById('game-container');

    const playerWidth = 64;
    const playerHeight = 80;
    const speed = 4;

    let posX = (container.clientWidth - playerWidth) / 2;
    let posY = (container.clientHeight - playerHeight) / 2;
    let isFacingLeft = false;
    let stepTimer = 0; // Utilizado para animar os passos

    player.style.left = posX + 'px';
    player.style.top = posY + 'px';

    const keys = {
      Up: false,
      Down: false,
      Left: false,
      Right: false
    };

    // --- Suporte a Teclado ---
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.Up = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.Down = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.Left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.Right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.Up = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.Down = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.Left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.Right = false;
    });

    // --- Suporte a Celular ---
    function setupTouchButton(id, dir) {
      const btn = document.getElementById(id);

      const start = (e) => {
        e.preventDefault();
        keys[dir] = true;
      };

      const end = (e) => {
        e.preventDefault();
        keys[dir] = false;
      };

      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
    }

    setupTouchButton('btn-up', 'Up');
    setupTouchButton('btn-down', 'Down');
    setupTouchButton('btn-left', 'Left');
    setupTouchButton('btn-right', 'Right');

    // --- Loop Principal ---
    function gameLoop() {
      let isMoving = false;

      if (keys.Up) { posY -= speed; isMoving = true; }
      if (keys.Down) { posY += speed; isMoving = true; }

      if (keys.Left) {
        posX -= speed;
        isFacingLeft = true;
        isMoving = true;
      }
      if (keys.Right) {
        posX += speed;
        isFacingLeft = false;
        isMoving = true;
      }

      // Limites da arena
      posX = Math.max(0, Math.min(container.clientWidth - playerWidth, posX));
      posY = Math.max(0, Math.min(container.clientHeight - playerHeight, posY));

      // Efeito visual de passos (balanço vertical enquanto anda)
      let bounceY = 0;
      if (isMoving) {
        stepTimer += 0.2;
        bounceY = Math.sin(stepTimer) * 3; // Faz o boneco subir e descer levemente
      } else {
        stepTimer = 0;
      }

      // Aplica a direção e a posição sem lag
      const scaleX = isFacingLeft ? -1 : 1;
      player.style.transform = `scaleX(${scaleX})`;
      player.style.left = posX + 'px';
      player.style.top = (posY + bounceY) + 'px';

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
