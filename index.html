<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Jogo Mobile - Animação</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: #1e1e24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 20px;
    }

    p {
      margin-bottom: 10px;
      color: #aaa;
      font-size: 14px;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 320px;
      background-color: #2b2b36;
      border: 4px solid #4e4e63;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    /* Container base da posição */
    #player-wrapper {
      position: absolute;
      width: 64px;
      height: 80px;
    }

    /* Sprite onde aplicamos a animação de passos/balanço */
    #player-sprite {
      width: 100%;
      height: 100%;
      background-image: url('./assets/Spr_E_Noland.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transform-origin: bottom center; /* Anima a partir dos pés */
    }

    /* Sombra nos pés para dar sensação de profundidade e chão */
    #player-shadow {
      position: absolute;
      bottom: 2px;
      left: 16px;
      width: 32px;
      height: 10px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 50%;
      z-index: -1;
    }

    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 65px);
      grid-template-rows: repeat(3, 65px);
      gap: 8px;
      margin-top: 15px;
      justify-content: center;
    }

    .btn-touch {
      background-color: #3b3b4f;
      color: #fff;
      border: 2px solid #5d5d7a;
      border-radius: 12px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 0 #222230;
    }

    .btn-touch:active {
      background-color: #5d5d7a;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #222230;
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>Mini Jogo Mobile</h1>
  <p>Toque nos botões para mover o personagem</p>

  <div id="game-container">
    <div id="player-wrapper">
      <div id="player-shadow"></div>
      <div id="player-sprite"></div>
    </div>
  </div>

  <div class="touch-controls">
    <button class="btn-touch btn-up" id="btn-up">⬆</button>
    <button class="btn-touch btn-left" id="btn-left">⬅</button>
    <button class="btn-touch btn-down" id="btn-down">⬇</button>
    <button class="btn-touch btn-right" id="btn-right">➡</button>
  </div>

  <script>
    const playerWrapper = document.getElementById('player-wrapper');
    const playerSprite = document.getElementById('player-sprite');
    const container = document.getElementById('game-container');

    const playerWidth = 64;
    const playerHeight = 80;
    const speed = 4;

    let posX = (container.clientWidth - playerWidth) / 2;
    let posY = (container.clientHeight - playerHeight) / 2;
    let isFacingLeft = false;
    let walkTimer = 0; // Controla a velocidade do passo da animação

    const keys = { Up: false, Down: false, Left: false, Right: false };

    function bindButton(id, keyName) {
      const btn = document.getElementById(id);
      
      const press = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[keyName] = true;
      };

      const release = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[keyName] = false;
      };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
    }

    bindButton('btn-up', 'Up');
    bindButton('btn-down', 'Down');
    bindButton('btn-left', 'Left');
    bindButton('btn-right', 'Right');

    function gameLoop() {
      let isMoving = false;

      if (keys.Up) { posY -= speed; isMoving = true; }
      if (keys.Down) { posY += speed; isMoving = true; }

      if (keys.Left) {
        posX -= speed;
        isFacingLeft = true;
        isMoving = true;
      }
      if (keys.Right) {
        posX += speed;
        isFacingLeft = false;
        isMoving = true;
      }

      // Limites da tela
      posX = Math.max(0, Math.min(container.clientWidth - playerWidth, posX));
      posY = Math.max(0, Math.min(container.clientHeight - playerHeight, posY));

      // Aplica a posição na tela
      playerWrapper.style.left = posX + 'px';
      playerWrapper.style.top = posY + 'px';

      // --- Animação Procedural de Passos ---
      const directionScale = isFacingLeft ? -1 : 1;

      if (isMoving) {
        walkTimer += 0.25; // Velocidade da passada

        // Simula a passada: Inclinação do corpo (Rotation) + Elevação dos passos (Bobbing/Tilt)
        const tiltAngle = Math.sin(walkTimer) * 8; // Inclina para frente/trás (+-8 graus)
        const stepBounce = Math.abs(Math.cos(walkTimer)) * 5; // Levanta o corpo a cada passo (0 a 5px)
        const squash = 1 + (Math.sin(walkTimer * 2) * 0.05); // Deforma levemente o corpo simetrizando o impacto da pisada

        playerSprite.style.transform = `
          scaleX(${directionScale}) 
          rotate(${tiltAngle * directionScale}deg) 
          translateY(${-stepBounce}px)
          scaleY(${squash})
        `;
      } else {
        // Personagem parado: Mantém em pé e reseta animações
        walkTimer = 0;
        playerSprite.style.transform = `scaleX(${directionScale}) rotate(0deg) translateY(0px) scaleY(1)`;
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
